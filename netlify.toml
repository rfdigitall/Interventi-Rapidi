[build]
  publish = "."
  # Static site — no build command needed

[[redirects]]
  from = "http://{host}/*"
  to = "https://{host}/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Content-Type = "image/x-icon"

# Clean URLs (optional pretty paths)
[[redirects]]
  from = "/fabbro"
  to = "/fabbro.html"
  status = 200

