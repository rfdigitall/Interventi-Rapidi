<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* Google Consent Mode v2 — snippet inline PRIMA di qualsiasi altro script.
   Garantisce l'ordine canonico: (1) stub gtag + dataLayer, (2) consent
   default DENIED, (3) load gtag.js con AW-ID. Il consenso viene poi
   aggiornato a GRANTED da consent-ads.js se già accettato in precedenza
   (lead_form_completed viene sparato solo se ?lead=1 + token sessione). */
(function () {
  window.dataLayer = window.dataLayer || [];
  window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
  if (!window.__gfConsentDefaultsSet) {
    window.__gfConsentDefaultsSet = true;
    window.gtag('consent', 'default', {
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      analytics_storage: 'denied',
      functionality_storage: 'granted',
      security_storage: 'granted',
      wait_for_update: 500
    });
    window.gtag('set', 'ads_data_redaction', true);
    window.gtag('set', 'url_passthrough', true);
  }
  var s = document.createElement('script');
  s.async = true;
  s.src = 'https://www.googletagmanager.com/gtag/js?id=AW-299646523';
  s.onload = function () {
    window.__gfGtagScriptLoaded = true;
    window.__gfGtagScriptLoading = false;
    var cbs = window.__gfGtagLoadCbs || [];
    window.__gfGtagLoadCbs = [];
    for (var i = 0; i < cbs.length; i++) { try { cbs[i](); } catch (e) {} }
  };
  s.onerror = function () { window.__gfGtagScriptLoading = false; };
  window.__gfGtagScriptLoading = true;
  window.__gfGtagLoadCbs = window.__gfGtagLoadCbs || [];
  (document.head || document.documentElement).appendChild(s);
})();
</script>
<script src="./support.js"></script>
<script src="./tracking-config.js"></script>
<script src="./consent-ads.js" defer></script>
</head>
<body>
<x-dc>
<helmet>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grazie — Ti richiamiamo subito | Gianfranco Tuttofare</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#050c18" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
body { margin: 0; }
a { color: inherit; text-decoration: none; }
@keyframes gfPop { 0% { transform: scale(0.5); opacity: 0; } 60% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
@keyframes gfCheck { from { stroke-dashoffset: 40; } to { stroke-dashoffset: 0; } }
@keyframes gfBlink { 0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.6); opacity: 1; } 50% { box-shadow: 0 0 0 7px rgba(34,197,94,0); opacity: 0.5; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</helmet>

<div style="--deep:#030912; --ink:#050c18; --blue:#1259b0; --blue-d:#0d3f80; --blue-l:#1a72d4; --aqua:#4aaee8; --wa:#25d366; --wa-d:#1fb558; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; min-height:100vh; background:var(--deep); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px 22px; box-sizing:border-box; position:relative; overflow:hidden;">
  <div style="position:absolute; inset:0; background:radial-gradient(ellipse 70% 55% at 50% 20%, rgba(26,114,212,0.24) 0%, transparent 66%); pointer-events:none;"></div>

  <div style="position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:20px; max-width:520px; width:100%;">
    <img src="assets/logo-white.png" alt="Gianfranco Tuttofare" style="height:52px; width:auto; margin-bottom:4px;" />

    <div style="width:92px; height:92px; border-radius:50%; background:var(--wa); display:flex; align-items:center; justify-content:center; animation:gfPop 0.5s ease-out both;">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12" style="stroke-dasharray:40; animation:gfCheck 0.5s ease-out 0.35s both;"></polyline></svg>
    </div>

    <h1 style="font-family:'Barlow Condensed',sans-serif; font-weight:800; text-transform:uppercase; font-size:clamp(30px,8vw,48px); line-height:0.96; margin:0;">Richiesta inviata!<br /><span style="color:var(--blue-l);">Ti ricontattiamo subito.</span></h1>

    <div style="display:inline-flex; align-items:center; gap:9px; font-size:12px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#fff;">
      <span style="width:10px; height:10px; border-radius:50%; background:#22c55e; animation:gfBlink 1.4s ease-in-out infinite; flex-shrink:0;"></span>
      Disponibili ora · H24
    </div>

    <div style="display:flex; flex-direction:column; gap:11px; width:100%; max-width:340px; margin-top:4px;">
      <a href="tel:+393201147517" onClick="{{ trackContatto }}" style="display:flex; align-items:center; justify-content:center; gap:11px; background:var(--blue); color:#fff; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:clamp(20px,5.5vw,26px); text-transform:uppercase; letter-spacing:0.02em; padding:16px 22px; border-radius:4px;" style-hover="background:var(--blue-d); color:#fff;">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" style="flex-shrink:0;"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.41 2 2 0 0 1 3.6 1h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 6 6l.96-.96a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Chiama 320 114 7517
      </a>
      <a href="{{ waHref }}" target="_blank" rel="noopener" onClick="{{ trackWa }}" aria-label="WhatsApp" style="display:flex; align-items:center; justify-content:center; gap:10px; background:var(--wa); color:#fff; font-weight:700; font-size:14px; letter-spacing:0.04em; padding:15px 22px; border-radius:4px;" style-hover="background:var(--wa-d); color:#fff;">
        <img src="assets/whatsapp.svg" width="28" height="28" alt="" decoding="async">
      </a>
    </div>

    <a href="{{ backHref }}" style="font-size:13px; color:rgba(255,255,255,0.45); margin-top:8px; text-decoration:underline;" style-hover="color:#fff;">← Torna al sito</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;phoneNumber&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;320 114 7517&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Contatti&quot;},
  &quot;whatsappNumber&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;320 114 7517&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Contatti&quot;},
  &quot;waMessage&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Ciao, ho appena inviato una richiesta dal sito.&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Contatti&quot;},
  &quot;backHref&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;index.html&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Contatti&quot;}
}">
class Component extends DCLogic {
  digits(str) { return (str || '').replace(/\D/g, ''); }

  trackEvent(name) {
    if (window.gfTrack) return window.gfTrack(name);
    if (!window.gtag) return;
    window.gtag('event', name, { event_category: 'engagement' });
    var map = (window.GF_TRACKING && window.GF_TRACKING.conversions) || window.GADS_CONVERSIONS || {};
    var sendTo = map[name] || (/(phone_click|whatsapp_click|form_submit|lead_form)/.test(name) ? map.default : null);
    if (sendTo) window.gtag('event', 'conversion', { send_to: sendTo, transport_type: 'beacon' });
  }

  componentDidMount() {
    // Conversione lead SOLO se arriva dal form (token lead=1 + session).
    if (window.gfConsumeLead && window.gfConsumeLead()) {
      this.trackEvent('lead_form_completed');
    }
    if (window.gfApplySeoAbsolute) window.gfApplySeoAbsolute('grazie.html');
  }

  renderVals() {
    const phoneDisplay = this.props.phoneNumber ?? '320 114 7517';
    const phoneDigits = this.digits(phoneDisplay);
    const waDigits = this.digits(this.props.whatsappNumber ?? '320 114 7517');
    const suffix = (window.gfGetAdsSuffix && window.gfGetAdsSuffix()) || '';
    const waMessage = (this.props.waMessage ?? 'Ciao, ho appena inviato una richiesta dal sito.') + suffix;
    return {
      phoneDisplay,
      telHref: `tel:+39${phoneDigits}`,
      waHref: `https://wa.me/39${waDigits}?text=${encodeURIComponent(waMessage)}`,
      backHref: (new URLSearchParams(location.search).get('back')) || this.props.backHref || 'index.html',
      trackContatto: () => this.trackEvent('phone_click_grazie'),
      trackWa: () => this.trackEvent('whatsapp_click_grazie'),
    };
  }
}
</script>
</body>
</html>
